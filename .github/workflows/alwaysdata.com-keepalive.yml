# action to hit Alwaysdata.com SQL to keep free tier alive, it adds a new  record in table "keep_alwaysdata_alive" in Alwaysdata SQL
# it runs autmatically every Monday or you can trigger it manually in Github/actions
# NB: Alwaysdata.com must have SQL -> table "keep_alwaysdata_alive" -> columns:  auto-inctement "id", "last_ping"

name: AlwaysData MySQL Keep Alive

on:
  schedule:
    - cron: "0 9 * * 1" # Every Monday at 09:00 UTC
  workflow_dispatch:

jobs:
  job_1_keep_alwaysdata_mysql_alive:
    runs-on: ubuntu-latest

    steps:
      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client

      - name: Ping Alwaysdata.com MySQL table "keep_alwaysdata_alive", adds a new  record in table "keep_alwaysdata_alive"
        run: |
          mysql \
            -h "${{ secrets.AlwaysData_DB_HOST }}" \
            -u "${{ secrets.AlwaysData_DB_USER }}" \
            -p"${{ secrets.AlwaysData_DB_PASSWORD }}" \
            "${{ secrets.AlwaysData_DB_NAME }}" \
            -e "INSERT INTO keep_alwaysdata_alive (last_ping) VALUES (NOW());"


  # Job-2  send notification "Created successful" to telegram  ---------------------------------------------------
  job_2_notify_in_telegram:
    runs-on: ubuntu-latest
    needs: [job_1_keep_alwaysdata_mysql_alive]  #will run only after these jobs

    steps:
      - name: Send message to Telegram
        if: success()  #Run this job only if all previous jobs have succeeded."
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}  #github secrets
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}   #github secrets
        run: |
          MESSAGE="💾 AlwaysData MySQL table keep_alwaysdata_alive received a new keep-alive record successfully"   #U+1F680 is UTF-8 for "rocket-icon".
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id=$TELEGRAM_CHAT_ID \
            -d text="$MESSAGE" \
            -d parse_mode=Markdown