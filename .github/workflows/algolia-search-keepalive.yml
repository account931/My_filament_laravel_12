# Action goal: simply prevent the project from becoming inactive.
# Runs automatically every Monday at 09:00 UTC.
# Can also be triggered manually from GitHub Actions.

name: Algolia Keep Alive

on:
  schedule:
    - cron: '0 9 * * 1' # Every Monday
  workflow_dispatch:    # Manual start enabled

jobs:
  job_1_keep_algolia_alive:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Algolia
        env:
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_SECRET: ${{ secrets.ALGOLIA_SECRET }}
        run: |
          curl --fail --silent --show-error \
            -X POST \
            -H "X-Algolia-Application-Id: $ALGOLIA_APP_ID" \
            -H "X-Algolia-API-Key: $ALGOLIA_SECRET" \
            -H "Content-Type: application/json" \
            --data '{"query":"","hitsPerPage":1}' \
            "https://${ALGOLIA_APP_ID}-dsn.algolia.net/1/indexes/products/query"


  # Job-2  send notification "Created successful" to telegram  ---------------------------------------------------
  job_2_notify_in_telegram:
    runs-on: ubuntu-latest
    needs: [job_1_keep_algolia_alive]  #will run only after these jobs
    # needs: [job_1_keep_supabase_alive, job_2_keep_supabase_sql_alive]

    steps:
      - name: Send message to Telegram
        if: success()  #Run this job only if all previous jobs have succeeded."
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}  #github secrets
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}   #github secrets
        run: |
          MESSAGE="💾 Algolia hit was performed successfully"   #U+1F680 is UTF-8 for "rocket-icon".
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id=$TELEGRAM_CHAT_ID \
            -d text="$MESSAGE" \
            -d parse_mode=Markdown