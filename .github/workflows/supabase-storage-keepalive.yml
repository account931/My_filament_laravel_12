# action to upload keep-supabase-alive.txt to Supabase Storage and insert a new record to Supabase SQL DB table "keep_supabase_alive" to keep free tier alive
# it runs autmatically every Monday or you can trigger it manually in Github/actions
# NB: Supabase must have SQL -> table "keep_supabase_alive" with columns: auto-increment "id" and "timestamp" with default value Now(). In job_2 we send empty POST and new records are inserted

name: Supabase Storage Keep Alive

on:
  schedule:
    - cron: "0 9 * * 1,3" # every Monday and Wednesday  
    #- cron: "0 9 * * 1" # every Monday at 09:00 UTC
  workflow_dispatch:

jobs:
  
  # Job 1, create keep-supabase-alive.txt file on Supabase storage, works!
  # Seems like hitting Storage is not counted as activity, so we add additional step where we hit SQL DB 
  job_1_keep_supabase_alive:
    runs-on: ubuntu-latest

    steps:
      - name: Create tiny file
        run: echo "I keep-supabase storage alive $(date)" > keep-supabase-alive.txt

      - name: Upload to Supabase Storage
        run: |
          curl -X PUT "${{ secrets.SUPABASE_URL }}/storage/v1/object/keep-alive-bucket/keep-supabase-alive.txt?upsert=true" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: text/plain" \
            --data-binary "@keep-supabase-alive.txt"

      - name: Wait 5 seconds
        run: sleep 5

      #- name: Delete file from Supabase Storage
      #  run: |
      #    curl -X DELETE "${{ secrets.SUPABASE_URL }}/storage/v1/object/keep-alive-bucket/keep-supabase-alive.txt" \
      #      -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
  

  # Hit Supabase SQL DB table "keep_supabase_alive", add new record via REST. Works!!!. 
  # Seems like hitting DB via REST is not counted as activity,
  # It sends empy POST to table and since table has columns: auto-increment "id" and "timestamp with default value Now(), new records are inserted
  # use CTRL + /  to fast comment/uncomment
  

  # job_2_keep_supabase_sql_alive:
  #   runs-on: ubuntu-latest

  #   steps:
  #     - name: Hit SQL DB table "keep_supabase_alive"
  #       run: |
  #         curl --fail --show-error --silent \
  #           -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/keep_supabase_alive" \
  #           -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
  #           -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
  #           -H "Content-Type: application/json" \
  #           -d '{}'


  # Connect directly to PostgreSQL and insert a keepalive record.
  # This is more likely to be counted as project activity than REST API requests.
  job_2_1_keep_supabase_sql_alive_via_PostgreSQL:
    runs-on: ubuntu-latest

    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Insert keepalive record
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$DATABASE_URL" \
            -c "INSERT INTO keep_supabase_alive DEFAULT VALUES;"

      - name: Verify record count
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$DATABASE_URL" \
            -c "SELECT COUNT(*) FROM keep_supabase_alive;"


  # Job-3  send notification "Created successful" to telegram  ---------------------------------------------------
  job_3_notify_in_telegram:
    runs-on: ubuntu-latest
    needs: [job_1_keep_supabase_alive, job_2_1_keep_supabase_sql_alive_via_PostgreSQL]  #will run only after these jobs
    # needs: [job_1_keep_supabase_alive, job_2_keep_supabase_sql_alive]

    steps:
      - name: Send message to Telegram
        if: success()  #Run this job only if all previous jobs have succeeded."
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}  #github secrets
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}   #github secrets
        run: |
          MESSAGE="💾 Supabase SQL DB table /keep_supabase_alive/ was hit (new record created) and  Supabase Storage keep-supabase-alive.txt was created successfully"   #U+1F680 is UTF-8 for "rocket-icon".
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id=$TELEGRAM_CHAT_ID \
            -d text="$MESSAGE" \
            -d parse_mode=Markdown
   
