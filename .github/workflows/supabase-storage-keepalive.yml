# action to upload somthing to Supabase Storage to keep free tier alive
name: Supabase Storage Keep Alive

on:
  schedule:
    - cron: "0 9 * * 1" # every Monday at 09:00 UTC
  workflow_dispatch:

jobs:
  
  # Job 1, create keep-supabase-alive.txt file on Supabase storage
  job_1_keep_supabase_alive:
    runs-on: ubuntu-latest

    steps:
      - name: Create tiny file
        run: echo "I keep-supabase storage alive $(date)" > keep-supabase-alive.txt

      - name: Upload to Supabase Storage
        run: |
          curl -X PUT "${{ secrets.SUPABASE_URL }}/storage/v1/object/keep-alive-bucket/keep-supabase-alive.txt?upsert=true" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: text/plain" \
            --data-binary "@keep-supabase-alive.txt"

      - name: Wait 5 seconds
        run: sleep 5

      #- name: Delete file from Supabase Storage
      #  run: |
      #    curl -X DELETE "${{ secrets.SUPABASE_URL }}/storage/v1/object/keep-alive-bucket/keepalive.txt" \
      #      -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
  

  # Job-2  send notification "Created successful" to telegram  ---------------------------------------------------
  job_2_notify_in_telegram:
    runs-on: ubuntu-latest
    needs: [job_1_keep_supabase_alive]  #will run only after these jobs

    steps:
      - name: Send message to Telegram
        if: success()  #Run this job only if all previous jobs have succeeded."
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}  #github secrets
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}   #github secrets
        run: |
          MESSAGE="✅  Supabase Storage keep-supabase-alive.txt was created successfully"   #U+1F680 is UTF-8 for "rocket-icon".
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id=$TELEGRAM_CHAT_ID \
            -d text="$MESSAGE" \
            -d parse_mode=Markdown
   